<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="tGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="40%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Background glow -->
  <circle cx="100" cy="90" r="55" fill="url(#glowGrad)" filter="url(#softGlow)" opacity="0.6"/>

  <!-- T letter - main body -->
  <g filter="url(#glow)">
    <!-- T horizontal bar -->
    <rect x="45" y="42" width="110" height="16" rx="8" fill="url(#tGrad)"/>
    <!-- T vertical stem -->
    <rect x="88" y="42" width="24" height="70" rx="8" fill="url(#tGrad)"/>
  </g>

  <!-- Infinity ribbon wrapping around T -->
  <g filter="url(#glow)">
    <!-- Left loop of infinity -->
    <path d="M 30 100 C 30 75, 55 60, 80 80 C 95 92, 95 108, 80 120 C 55 140, 30 125, 30 100 Z"
          fill="none" stroke="url(#ribbonGrad)" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
    <!-- Right loop of infinity -->
    <path d="M 170 100 C 170 75, 145 60, 120 80 C 105 92, 105 108, 120 120 C 145 140, 170 125, 170 100 Z"
          fill="none" stroke="url(#ribbonGrad)" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
    <!-- Center crossing -->
    <path d="M 50 120 C 70 95, 90 95, 100 100 C 110 105, 130 105, 150 80"
          fill="none" stroke="url(#ribbonGrad)" stroke-width="5" stroke-linecap="round" opacity="0.75"/>
  </g>

  <!-- Small sparkle dots -->
  <circle cx="35" cy="80" r="2" fill="#38bdf8" opacity="0.8"/>
  <circle cx="165" cy="85" r="1.5" fill="#c084fc" opacity="0.7"/>
  <circle cx="55" cy="135" r="1.5" fill="#818cf8" opacity="0.6"/>
  <circle cx="148" cy="130" r="2" fill="#06b6d4" opacity="0.7"/>
  <circle cx="100" cy="145" r="1" fill="#38bdf8" opacity="0.5"/>
</svg>
