<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#050a18"/>
    </linearGradient>
    <linearGradient id="tGrad" x1="150" y1="100" x2="360" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="80" y1="150" x2="430" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="35%" stop-color="#38bdf8"/>
      <stop offset="65%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <g filter="url(#glow)">
    <rect x="130" y="140" width="252" height="40" rx="20" fill="url(#tGrad)"/>
    <rect x="230" y="140" width="52" height="170" rx="20" fill="url(#tGrad)"/>
  </g>
  <g filter="url(#glow)">
    <path d="M 100 300 C 100 230, 170 200, 236 260 C 256 282, 256 308, 236 330 C 170 390, 100 360, 100 300 Z" fill="none" stroke="url(#ribbonGrad)" stroke-width="14" stroke-linecap="round" opacity="0.9"/>
    <path d="M 412 300 C 412 230, 342 200, 276 260 C 256 282, 256 308, 276 330 C 342 390, 412 360, 412 300 Z" fill="none" stroke="url(#ribbonGrad)" stroke-width="14" stroke-linecap="round" opacity="0.9"/>
    <path d="M 140 360 C 190 290, 240 280, 256 300 C 272 320, 322 310, 372 250" fill="none" stroke="url(#ribbonGrad)" stroke-width="10" stroke-linecap="round" opacity="0.6"/>
  </g>
  <circle cx="105" cy="240" r="5" fill="#38bdf8" opacity="0.9"/>
  <circle cx="407" cy="245" r="4" fill="#c084fc" opacity="0.8"/>
